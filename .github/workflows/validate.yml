name: Validate data and build site JSON

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prove the validator rejects a known-bad fixture
        run: python scripts/build_data.py --selftest
      - name: Source configuration checks
        run: python tests/test_sources.py && python tests/test_manifest.py
      - name: Crawler parsing checks (offline)
        run: python tests/test_crawl.py
      - name: Discount badge percentage checks
        run: python tests/test_percent.py
      - name: Validate dataset against schema and build data.json
        run: python scripts/build_data.py --check
