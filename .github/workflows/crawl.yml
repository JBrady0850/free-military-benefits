name: Daily harvest, Veterans Day lists, weekly store locations

# The page shows the next run from these times (RUNS_UTC in site/index.html); keep the two in step.
on:
  schedule:
    - cron: "17 11 * * *"        # every day 11:17 UTC: discounts and Veterans Day lists
    - cron: "17 9 * * 1"         # Mondays 09:17 UTC: also store, VA and base locations (All the Places publishes Fridays)
    - cron: "17 0,6,12,18 1-14 11 *" # every 6 hours November 1 to 14, while Veterans Day offers are announced
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Harvest discounts (two-source rule) and Veterans Day lists
        run: python scripts/crawl.py
      - name: Refresh store, VA and base locations (All the Places, OpenStreetMap, Wikidata), weekly
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 9 * * 1'
        run: python scripts/snapshot_places.py
        continue-on-error: true
      - name: Rebuild and validate data.json
        run: |
          python scripts/build_data.py --selftest
          python tests/test_sources.py
          python tests/test_manifest.py
          python tests/test_crawl.py
          python tests/test_percent.py
          python scripts/build_data.py --check
      - name: Commit if anything changed, then redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "free-military-benefits-bot"
          git config user.email "free-military-benefits-bot@users.noreply.github.com"
          git add data/crawled.yaml data/crawled-veterans-day.yaml data/watch.json site/data.json site/places.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Scheduled refresh: discounts, Veterans Day lists, source check times"
            git push
            gh workflow run pages.yml --ref main
          fi
