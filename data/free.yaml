# Free Military Benefits free dataset. Rules: README.md "Data rules".
entries:
  - id: military-lifetime-pass
    name: America the Beautiful Military Lifetime Pass
    category: parks
    offer: Free lifetime entrance to 2,000+ federal recreation sites (national parks, wildlife refuges, forests) for the passholder and vehicle passengers.
    eligibility: [veteran, gold-star-family]
    verification: [va-letter, military-id, dd214]
    scope: nationwide
    source_url: https://www.nps.gov/planyourvisit/passes.htm
    last_verified: "2026-11-01"
    confidence: official
    notes: Authorized by the Alexander Lofgren Veterans in Parks Act; issued free at participating sites or online.
  - id: military-annual-pass
    name: America the Beautiful Military Annual Pass
    category: parks
    offer: Free annual pass to the same federal recreation sites for current service members and their dependents.
    eligibility: [active-duty, guard-reserve, dependent]
    verification: [military-id]
    scope: nationwide
    source_url: https://www.nps.gov/planyourvisit/passes.htm
    last_verified: "2026-11-01"
    confidence: official
  - id: access-pass
    name: Access Pass (free lifetime, permanent disability)
    category: parks
    offer: Free lifetime pass to federal recreation sites for citizens with a permanent disability, including service-connected ratings; VA award letter or summary of benefits accepted.
    eligibility: [disabled-veteran, everyone]
    verification: [va-letter]
    scope: nationwide
    source_url: https://www.nps.gov/planyourvisit/passes.htm
    last_verified: "2026-11-01"
    confidence: official
  - id: nps-fee-free-days
    name: National Park fee-free entrance days
    category: parks
    offer: All National Park Service sites that charge entrance fees are free to everyone on designated days, including Veterans Day (November 11).
    eligibility: [everyone]
    verification: [none]
    scope: nationwide
    source_url: https://www.nps.gov/planyourvisit/fee-free-parks.htm
    last_verified: "2026-11-01"
    confidence: official
  - id: va-facility-finder
    name: VA facility finder (medical centers, clinics, Vet Centers)
    category: facilities
    offer: Free locator for every VA medical center, outpatient clinic, Vet Center, and benefits office, with services and hours.
    eligibility: [veteran, active-duty, dependent]
    verification: [none]
    scope: nationwide
    source_url: https://www.va.gov/find-locations
    last_verified: "2026-11-01"
    confidence: official
    notes: Backed by the public VA Lighthouse Facilities API (CC0), which this project will snapshot for its map.
  - id: uso-centers
    name: USO centers and airport lounges
    category: facilities
    offer: Free USO center access for service members and their families, including airport locations.
    eligibility: [active-duty, guard-reserve, dependent]
    verification: [military-id]
    scope: locations
    source_url: https://www.uso.org/locations
    last_verified: "2026-11-01"
    confidence: official
  - id: veteran-id-card
    name: VA Veteran ID Card
    category: identity
    offer: Free VA-issued photo ID that proves veteran status for discounts without carrying a DD-214.
    eligibility: [veteran]
    verification: [none]
    scope: online
    source_url: https://www.va.gov/records/get-veteran-id-cards/vic/
    last_verified: "2026-11-01"
    confidence: official
  # Free experiences and support. Descriptions are written for this project; the
  # provider pages were reviewed on 2026-09-06 by the techwithvictoria/veteran-opportunities
  # directory, credited in the README. Confirm current terms with each provider.
  - id: saratoga-warhorse
    name: Saratoga WarHorse equine retreat
    category: retreats
    offer: Three-day equine program for veterans and service members dealing with trauma. Program, lodging, meals and travel are covered; no combat service or diagnosis required.
    eligibility: [veteran, active-duty]
    verification: [see-source]
    scope: nationwide
    source_url: https://www.saratogawarhorse.org/enroll
    last_verified: "2026-09-06"
    confidence: community
  - id: wwp-project-odyssey
    name: Wounded Warrior Project, Project Odyssey
    category: retreats
    offer: A 12-week program that includes a five-day retreat, with individual, family and couples formats. Program, food, lodging and travel are covered for eligible post-9/11 participants.
    eligibility: [veteran, active-duty, spouse]
    verification: [see-source]
    scope: nationwide
    source_url: https://www.woundedwarriorproject.org/programs/project-odyssey
    last_verified: "2026-09-06"
    confidence: community
  - id: honor-flight
    name: Honor Flight
    category: retreats
    offer: Sponsored trips to see the war memorials in Washington, D.C.; honored veterans travel free. Apply through a local hub; service-era priorities vary.
    eligibility: [veteran]
    verification: [see-source]
    scope: nationwide
    source_url: https://www.honorflight.org/
    last_verified: "2026-09-06"
    confidence: community
  - id: vet-tix
    name: Vet Tix donated event tickets
    category: attractions
    offer: Donated tickets to concerts, sports and other events for verified service members, veterans and qualifying family of those killed in action. A delivery fee applies.
    eligibility: [veteran, active-duty, gold-star-family]
    verification: [see-source]
    scope: nationwide
    source_url: https://www.vettix.org/
    last_verified: "2026-09-06"
    confidence: community
  - id: dav-rides
    name: DAV rides to VA medical appointments
    category: support
    offer: Free volunteer transportation to and from VA medical facilities for ill and injured veterans where the service is available. Book ahead with the local coordinator.
    eligibility: [veteran]
    verification: [none]
    scope: locations
    source_url: https://www.dav.org/get-help-now/medical-transportation/
    last_verified: "2026-09-06"
    confidence: community
  - id: vita-tax-prep
    name: Free tax preparation (IRS VITA and TCE)
    category: support
    offer: Free basic tax-return preparation for qualifying taxpayers, including veterans who meet the income, disability or age criteria.
    eligibility: [everyone]
    verification: [none]
    scope: locations
    source_url: https://www.irs.gov/individuals/irs-free-tax-return-preparation-programs
    last_verified: "2026-09-06"
    confidence: community
