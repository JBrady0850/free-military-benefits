# Pages read by scripts/crawl.py. Only pages whose robots.txt allows crawling are read.
# Only facts are kept (brand, percentage, link); no text is copied.
#
# Listing rules (John, 2026-11-01):
#   - more than 20 percent, so threshold 21
#   - every listed offer needs at least two independent sources: two different sites,
#     or one site plus the brand's own page confirming the percentage
#   - every link opens directly at the offer (brand page, or the source with the line highlighted)
#   - sites on one registrable domain count once (365.military.com and military.com are one source)
#   - wording such as "likely", "expected", "pending" or "2025 terms" is never counted as an offer
threshold: 21
veterans_day_year: 2026

