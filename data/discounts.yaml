# Earned Benefits discount dataset. Rules: README.md "Data rules".
entries:
  - id: govx-marketplace
    name: GovX
    category: marketplace
    offer: Free account unlocks 10 to 50 percent off at 400+ brands (gear, apparel, travel, electronics, tickets). The community calls it the master key.
    eligibility: [active-duty, veteran, retiree, guard-reserve, spouse]
    verification: [govx, dd214, military-id]
    scope: online
    source_url: https://www.govx.com
    last_verified: "2026-11-01"
    confidence: official
    notes: Register once with a .mil email, military or veteran ID, or DD-214.
  - id: idme-shop
    name: ID.me Shop
    category: marketplace
    offer: Military discounts across thousands of brands, plus recurring bill discounts (for example Verizon). One verified account works at many stores.
    eligibility: [active-duty, veteran, retiree, guard-reserve, spouse]
    verification: [id.me]
    scope: online
    source_url: https://shop.id.me
    last_verified: "2026-11-01"
    confidence: official
    notes: Verification is the most friction-heavy of the services; keep the account active year-round so it does not lapse.
  - id: expertvoice
    name: ExpertVoice
    category: outdoor
    offer: Free membership for the military community with brand discounts and flash deals up to 60 percent.
    eligibility: [active-duty, veteran, spouse]
    verification: [sheerid]
    scope: online
    source_url: https://get.expertvoice.com/military-community/
    last_verified: "2026-11-01"
    confidence: official
  - id: exchange-online-veterans
    name: Exchange online shopping (AAFES, NEX, CGX)
    category: retail
    offer: Lifetime online military exchange shopping, tax free, for honorably discharged veterans.
    eligibility: [veteran, retiree, active-duty, guard-reserve]
    verification: [vetverify]
    scope: online
    source_url: https://www.vetverify.org
    last_verified: "2026-11-01"
    confidence: official
    notes: Verify once at VetVerify; covers shopmyexchange.com, mynavyexchange.com, and shopcgx.com.
